<!DOCTYPE html>
<html lang="id">
  <head>

    <title>Game SD - Susun Blok Coding</title>
    <link rel="stylesheet" href="sd-style.css" />
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Game SD: Susun Perintah Robot</h1>
